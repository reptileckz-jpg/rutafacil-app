name: Armar APK

# Se arma solo cada vez que se sube algo a main. También se puede correr a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar que exista la clave de firma
        env:
          RF_PASS: ${{ secrets.RF_PASS }}
        run: |
          if [ -z "$RF_PASS" ]; then
            echo "::error::Falta el secreto RF_PASS (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Armar la app con Vite (capas → www/index.html)
        run: |
          npm run build
          ls -la dist-vite www/index.html

      - name: Empaquetar la conexión con la nube (Firebase)
        run: |
          npx esbuild nube/entrada.js --bundle --minify --format=iife --target=es2020 --outfile=www/firebase.js
          ls -la www/firebase.js

      - name: Google Maps (si existe la llave MAPS_KEY)
        env:
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
        run: |
          npx esbuild nube/mapas.js --bundle --minify --format=iife --target=es2020 --outfile=www/mapas.js
          if [ -n "$MAPS_KEY" ]; then echo "window.PN_GMAPS=true" > www/mapas-cfg.js; else echo "window.PN_GMAPS=false" > www/mapas-cfg.js; echo "::warning::No hay llave MAPS_KEY: la app usa los mapas de siempre."; fi
          ls -la www/mapas.js www/mapas-cfg.js

      - name: Mapas (Leaflet)
        run: |
          mkdir -p www/leaflet
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/leaflet/
          ls -la www/leaflet
          # 37 · captura de pantalla para el reporte de errores (sin internet)
          mkdir -p www/h2c
          cp node_modules/html2canvas-pro/dist/html2canvas-pro.min.js www/h2c/html2canvas.min.js
          ls -la www/h2c

      - name: Crear el proyecto de Android
        run: npx cap add android

      - name: Permiso de ubicación (GPS)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' $M
          grep -n "LOCATION" $M

      - name: Partes nativas (huella, WhatsApp, impresora Bluetooth, Descargas, escáner, GPS, avisos push)
        env:
          MAPS_KEY: ${{ secrets.MAPS_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          D=android/app/src/main/java/com/rutafacil/app
          cp nativo/RutaNativa.java nativo/MainActivity.java nativo/RutaAdmin.java nativo/RutaGps.java nativo/RutaArranque.java $D/
          mkdir -p android/app/src/main/res/xml && cp nativo/ruta_admin.xml android/app/src/main/res/xml/
          G=android/app/build.gradle
          sed -i '0,/dependencies {/s//dependencies {\n    implementation "androidx.biometric:biometric:1.1.0"\n    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"\n    implementation "com.google.android.gms:play-services-location:21.3.0"\n    implementation "com.google.firebase:firebase-messaging:24.1.0"/' $G
          grep -n "biometric\|code-scanner\|play-services-location" $G
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <queries><package android:name="com.whatsapp" /><package android:name="com.whatsapp.w4b" /><intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent><intent><action android:name="android.intent.action.MAIN" /></intent></queries>\n</manifest>#' $M
          sed -i 's#</application>#    <receiver android:name=".RutaAdmin" android:exported="true" android:permission="android.permission.BIND_DEVICE_ADMIN"><meta-data android:name="android.app.device_admin" android:resource="@xml/ruta_admin" /><intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED" /></intent-filter></receiver>\n    <service android:name=".RutaGps" android:exported="false" android:foregroundServiceType="location" />\n    <receiver android:name=".RutaArranque" android:exported="true"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /><action android:name="android.intent.action.QUICKBOOT_POWERON" /><action android:name="android.intent.action.MY_PACKAGE_REPLACED" /><action android:name="android.intent.action.ACTION_SHUTDOWN" /><action android:name="android.intent.action.QUICKBOOT_POWEROFF" /></intent-filter></receiver>\n    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\n    </application>#' $M
          if [ -n "$MAPS_KEY" ]; then sed -i "s#</application>#    <meta-data android:name=\"com.google.android.geo.API_KEY\" android:value=\"$MAPS_KEY\" />\n    </application>#" $M; fi
          # 132 · avisos push: el canal "avisos" es el de los push de Firebase; google-services.json sale del secreto (si no está, se arma igual sin push)
          sed -i "s#</application>#    <meta-data android:name=\"com.google.firebase.messaging.default_notification_channel_id\" android:value=\"avisos\" />\n    </application>#" $M
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "google-services.json: sí (avisos push)"; else echo "google-services.json: no está el secreto GOOGLE_SERVICES_JSON (sin avisos push)"; fi
          grep -n "BLUETOOTH\|queries\|CAMERA\|NOTIF\|RutaAdmin\|RutaGps\|RutaArranque\|BACKGROUND\|mlkit" $M
          grep -c "geo.API_KEY" $M || true

      - name: Íconos y pantalla de inicio
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2F7D32' --iconBackgroundColorDark '#2F7D32' --splashBackgroundColor '#F6F1E3' --splashBackgroundColorDark '#1E2A1A'

      - name: Copiar la app web
        run: npx cap sync android

      - name: Número de versión
        run: |
          N=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.0.$N\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Armar el APK firmado
        env:
          RF_PASS: ${{ secrets.RF_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/firma/rutafacil.jks \
            -Pandroid.injected.signing.store.password="$RF_PASS" \
            -Pandroid.injected.signing.key.alias=rutafacil \
            -Pandroid.injected.signing.key.password="$RF_PASS"
          mkdir -p $GITHUB_WORKSPACE/salida
          cp app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/salida/RutaFacil-1.0.${{ github.run_number }}.apk
          ls -la $GITHUB_WORKSPACE/salida

      - uses: actions/upload-artifact@v4
        with:
          name: RutaFacil-1.0.${{ github.run_number }}
          path: salida/*.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ruta Fácil 1.0.${{ github.run_number }}
          body: APK armado automáticamente. Descárgalo e instálalo en el celular.
          files: salida/*.apk
