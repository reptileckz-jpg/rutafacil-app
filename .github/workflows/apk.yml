name: Armar APK

# Se arma solo cada vez que se sube algo a main. También se puede correr a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Revisar que exista la clave de firma
        env:
          RF_PASS: ${{ secrets.RF_PASS }}
        run: |
          if [ -z "$RF_PASS" ]; then
            echo "::error::Falta el secreto RF_PASS (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto de Android
        run: npx cap add android

      - name: Permiso de ubicación (GPS)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' $M
          grep -n "LOCATION" $M

      - name: Íconos y pantalla de inicio
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#2F7D32' --iconBackgroundColorDark '#2F7D32' --splashBackgroundColor '#F6F1E3' --splashBackgroundColorDark '#1E2A1A'

      - name: Copiar la app web
        run: npx cap sync android

      - name: Número de versión
        run: |
          N=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"1.0.$N\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Armar el APK firmado
        env:
          RF_PASS: ${{ secrets.RF_PASS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/firma/rutafacil.jks \
            -Pandroid.injected.signing.store.password="$RF_PASS" \
            -Pandroid.injected.signing.key.alias=rutafacil \
            -Pandroid.injected.signing.key.password="$RF_PASS"
          mkdir -p $GITHUB_WORKSPACE/salida
          cp app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/salida/RutaFacil-1.0.${{ github.run_number }}.apk
          ls -la $GITHUB_WORKSPACE/salida

      - uses: actions/upload-artifact@v4
        with:
          name: RutaFacil-1.0.${{ github.run_number }}
          path: salida/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ruta Fácil 1.0.${{ github.run_number }}
          body: APK armado automáticamente. Descárgalo e instálalo en el celular.
          files: salida/*.apk
