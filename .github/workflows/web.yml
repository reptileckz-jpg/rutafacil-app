name: Publicar la web

# 164 · La versión para computadora (se instala desde Chrome o Edge). Se publica sola cada vez que se sube algo a main (igual que el APK),
# en Firebase Hosting del proyecto platanos-nietos: https://platanos-nietos.web.app . También se puede correr a mano desde Actions.
# Necesita el secreto FIREBASE_SA (el mismo de "Publicar avisos push y reglas de la nube").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        run: npm install --no-audit --no-fund
      - name: Armar la web (Vite)
        run: bash fuente/web.sh "1.0.${{ github.run_number }}-${{ github.sha }}"
      - name: Publicar en Firebase Hosting
        env:
          SA: ${{ secrets.FIREBASE_SA }}
        run: |
          if [ -z "$SA" ]; then echo "Falta el secreto FIREBASE_SA."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only hosting --project platanos-nietos --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
